# =============================================================================
# docker-compose.prod.yml
# Entorno de producción para Alentapp
# Uso: docker compose -f docker-compose.prod.yml up -d
# Requiere: archivo .env en la raíz (ver .env.example)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Base de datos PostgreSQL
  # Puerto 5432 NO expuesto al host (solo accesible desde red interna)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: alentapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - alentnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Migrate — aplica migraciones Prisma antes de levantar la API (one-shot)
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
      target: migrate
    container_name: alentapp-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - alentnet
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API — Fastify + Prisma + OpenTelemetry
  # Puerto 3000 expuesto al host (acceso desde browser o nginx)
  # Puerto 9464 solo en red interna (Prometheus scrape, no expuesto al host)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
    image: alentapp-api:prod
    container_name: alentapp-api
    restart: unless-stopped
    environment:
      NODE_ENV:     production
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${API_PORT:-3000}:3000"
    # Puerto 9464 intencionalmente NO mapeado al host
    # Prometheus accede desde la red interna alentnet
    expose:
      - "9464"
    networks:
      - alentnet
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "packages/api/src/app.js"]
    read_only: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend — nginx sirve los archivos estáticos de Vite
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
    image: alentapp-web:prod
    container_name: alentapp-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:8080"
    networks:
      - alentnet
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Prometheus — recolecta métricas de la API
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: alentapp-prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - alentnet
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Grafana — visualización de métricas RED
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: alentapp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - alentnet
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Redes
# =============================================================================
networks:
  alentnet:
    driver: bridge
    name: alentnet

# =============================================================================
# Volúmenes persistentes
# =============================================================================
volumes:
  pgdata:
  prometheus_data:
  grafana_data: